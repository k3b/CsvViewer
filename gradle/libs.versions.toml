[versions]
# android versions see https://apilevels.com/
# gradle versions see https://gradle.org/releases/

#--------------------------------
# android specific libs
# android-agp = "8.13.2"
android-agp = "9.3.1"

android-junit-runtime = "1.3.0"
android-espressoCore = "3.7.0"
android-appcompat = "1.7.1" # last update May 29, 2024
android-appcompat-last = "1.8.0" # last update Aug 12, 2026

android-material = "1.13.0"
android-material-last = "1.14.0"
android-constraintlayout = "2.2.1" # last updtate Feb 26, 2025
android-constraintlayout-last = "2.2.2" # last updtate Jul 29, 2026
android-documentfile = "1.1.0"

# activity 1.11.0 last version compatible with api-21. 1.12.2-Requires api 23
# https://mvnrepository.com/artifact/androidx.activity/activity
android-activity-old5 = "1.11.0" # last update Sep 10, 2025
android-activity = "1.13.0" # last update Mar 11, 2026

# webkit 1.14.0 last version compatible with api-21. 1.15.0-Requires api 23
android-webkit-old5 = "1.14.0"
android-webkit = "1.15.0"
android-webkit-last = "1.17.0"

#--------------------------------
# android independent libs

junit = "4.13.2"

# commonsIo = "2.7": last version compatible with java-8
#noinspection NewerVersionAvailable
commonsIo-old5 = "2.7" # Last update May 27, 2020. Contains known vulnerabilities https://mvnrepository.com/artifact/commons-io/commons-io/versions
commonsIo = "2.22.0"

# 1.7.36 last version available for java-7
#noinspection NewerVersionAvailable
slf4j = "1.7.36"

# opencsv = "3.10": last version compatible with java-8
# https://mvnrepository.com/artifact/com.opencsv/opencsv
#noinspection NewerVersionAvailable
opencsv-old5 = "3.10" # last update Jul 02, 2017
opencsv = "5.12.0" # Jul 27, 2025

jspecify = "1.0.0"

[libraries]
# android independant ide support for null/notnull
java-jspecify = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify" }

# non-android StringUtils
old5-java-commons-io = { module = "commons-io:commons-io", version.ref = "commonsIo-old5" }
java-commons-io = { module = "commons-io:commons-io", version.ref = "commonsIo" }

slf4j-api = { group="org.slf4j", name="slf4j-api", version.ref = "slf4j" }
slf4j-android = { group="org.slf4j", name="slf4j-android", version.ref = "slf4j" }
slf4j-j2se = { group="org.slf4j", name="slf4j-simple", version.ref = "slf4j" }

# non-android csv parser/generator
java-opencsv = { module = "com.opencsv:opencsv", version.ref = "opencsv" }
old5-java-opencsv = { module = "com.opencsv:opencsv", version.ref = "opencsv-old5" }

# Android activity specific
android-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "android-appcompat" }
android-appcompat-last = { group = "androidx.appcompat", name = "appcompat", version.ref = "android-appcompat-last" }
android-material = { group = "com.google.android.material", name = "material", version.ref = "android-material" }
last-android-material = { group = "com.google.android.material", name = "material", version.ref = "android-material-last" }
android-activity = { group = "androidx.activity", name = "activity", version.ref = "android-activity" }
old5-android-activity = { group = "androidx.activity", name = "activity", version.ref = "android-activity-old5" }
android-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "android-constraintlayout" }
android-constraintlayout-last = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "android-constraintlayout-last" }
android-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "android-documentfile" }

last-android-webkit = { module = "androidx.webkit:webkit", version.ref = "android-webkit-last" }
android-webkit = { module = "androidx.webkit:webkit", version.ref = "android-webkit" }
old5-android-webkit = { module = "androidx.webkit:webkit", version.ref = "android-webkit-old5" }

# Test(dirven) specific
test-java-junit = { group = "junit", name = "junit", version.ref = "junit" }
test-android-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "android-junit-runtime" }
test-android-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "android-espressoCore" }

[bundles]
api29 = [ "java-opencsv"    , "java-commons-io"    , "android-activity"    ]
api24 = [ "java-opencsv"    , "java-commons-io"    , "android-activity"    ]
api23 = [ "java-opencsv"    , "java-commons-io"    , "android-activity"    ]
api21 = [ "old5-java-commons-io", "old5-android-activity"]

# used by android app
last-android  = [ "java-jspecify", "android-appcompat-last" , "last-android-material", "android-constraintlayout-last", "slf4j-api", "slf4j-android", "android-documentfile"]
android       = [ "java-jspecify", "android-appcompat"      , "android-material"     , "android-constraintlayout", "slf4j-api", "slf4j-android", "android-documentfile"]

# used by lib, may bo overwritten with more recent version by android-app
old5-java = [ "java-jspecify", "old5-java-opencsv", "old5-java-commons-io", "slf4j-api"]

[plugins]
android-application = { id = "com.android.application", version.ref = "android-agp" }
